root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  entrypoint = ["./tmp/api"]
  include_ext = ["go"]
  include_file = ["go.mod", "go.sum"]
  exclude_dir = ["tmp", "vendor", ".git"]
  exclude_regex = ["_test.go"]
  delay = 500
  stop_on_error = true

[build.windows]
  cmd = "go build -o ./tmp/api.exe ./cmd/api"
  entrypoint = ["./tmp/api.exe"]

[[build.rules]]
  name = "openapi"
  include_file = ["api/openapi.yaml", "api/oapi-codegen.yaml"]
  cmd = "go tool oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml"

[log]
  time = true

[misc]
  clean_on_exit = true
