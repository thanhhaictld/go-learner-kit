openapi: 3.0.3

info:
  title: User Service API
  version: 1.0.0

servers:
  - url: /api/v1

paths:

  /users:
    post:
      operationId: createUser
      tags:
        - Users

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"

      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      operationId: listUsers
      tags:
        - Users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags:
        - Users

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:

  schemas:

    CreateUserRequest:
      type: object
      required:
        - email
        - name

      properties:
        email:
          type: string
          format: email

        name:
          type: string
          minLength: 1

    User:
      type: object
      required:
        - id
        - email
        - name
        - createdAt

      properties:

        id:
          type: string
          format: uuid

        email:
          type: string
          format: email

        name:
          type: string

        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      required:
        - code
        - message

      properties:
        code:
          type: string

        message:
          type: string
