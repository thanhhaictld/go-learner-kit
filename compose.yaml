services:
  user-db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: users
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d users"]
      interval: 3s
      timeout: 3s
      retries: 10

  user-migrate:
    image: migrate/migrate:v4.19.1
    command: ["-path", "/migrations", "-database", "postgres://app:app@user-db:5432/users?sslmode=disable", "up"]
    volumes:
      - ./src/user-svc/migrations:/migrations:ro
    depends_on:
      user-db:
        condition: service_healthy

  identity-db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: identity
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d identity"]
      interval: 3s
      timeout: 3s
      retries: 10

  identity-migrate:
    build: ./src/identity-svc
    command: ["--migrate"]
    environment:
      ConnectionStrings__Default: Host=identity-db;Port=5432;Database=identity;Username=app;Password=app
      OpenIddict__Issuer: http://localhost:8081
      OpenIddict__AllowInsecureHttp: "true"
      Bootstrap__OrganizationId: ${BOOTSTRAP_ORGANIZATION_ID:-22222222-2222-2222-2222-222222222222}
      Bootstrap__AdminUserId: ${BOOTSTRAP_ADMIN_USER_ID:-11111111-1111-1111-1111-111111111111}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.test}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-changeMe@123!}
    depends_on:
      identity-db:
        condition: service_healthy

  openfga-db:
    image: postgres:17
    environment:
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: openfga
      POSTGRES_DB: openfga
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga -d openfga"]
      interval: 3s
      timeout: 3s
      retries: 10

  openfga-migrate:
    image: openfga/openfga:v1.10.3
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@openfga-db:5432/openfga?sslmode=disable
    depends_on:
      openfga-db:
        condition: service_healthy

  openfga:
    image: openfga/openfga:v1.10.3
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@openfga-db:5432/openfga?sslmode=disable
      OPENFGA_METRICS_ADDR: 0.0.0.0:2112
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully

  authz-service:
    build: ./src/authz-svc
    environment:
      FGA_API_URL: http://openfga:8080
      FGA_STORE_NAME: go-learner-authz
      BOOTSTRAP_ORGANIZATION_ID: ${BOOTSTRAP_ORGANIZATION_ID:-22222222-2222-2222-2222-222222222222}
      BOOTSTRAP_ADMIN_USER_ID: ${BOOTSTRAP_ADMIN_USER_ID:-11111111-1111-1111-1111-111111111111}
      IDENTITY_PROVISIONING_TOKEN: ${IDENTITY_PROVISIONING_TOKEN:-development-only-change-me}
    depends_on:
      openfga:
        condition: service_started

  identity-service:
    build: ./src/identity-svc
    environment:
      ConnectionStrings__Default: Host=identity-db;Port=5432;Database=identity;Username=app;Password=app
      OpenIddict__Issuer: http://localhost:8081
      OpenIddict__AllowInsecureHttp: "true"
      Authz__ServiceUrl: http://authz-service:8080
      Authz__ProvisioningToken: ${IDENTITY_PROVISIONING_TOKEN:-development-only-change-me}
    ports:
      - "8081:8080"
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
      authz-service:
        condition: service_started

  user-service:
    build: ./src/user-svc
    environment:
      DB_HOST: user-db
      DB_PORT: 5432
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: users
      DB_SSLMODE: disable
      AUTHZ_SERVICE_URL: http://authz-service:8080
    ports:
      - "8080:8080"
    depends_on:
      user-migrate:
        condition: service_completed_successfully
      authz-service:
        condition: service_started

  user-db-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://app:app@user-db:5432/users?sslmode=disable
    depends_on:
      user-db:
        condition: service_healthy

  openfga-db-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://openfga:openfga@openfga-db:5432/openfga?sslmode=disable
    depends_on:
      openfga-db:
        condition: service_healthy

  identity-db-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://app:app@identity-db:5432/identity?sslmode=disable
    depends_on:
      identity-db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./platform/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      user-service:
        condition: service_started
      authz-service:
        condition: service_started
      identity-service:
        condition: service_started

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./platform/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./platform/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  prometheus-data:
  grafana-data:
