global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: user-service
    metrics_path: /metrics
    static_configs:
      - targets: ["user-service:8080"]

  - job_name: authz-service
    metrics_path: /metrics
    static_configs:
      - targets: ["authz-service:8080"]

  - job_name: identity-service
    metrics_path: /metrics
    static_configs:
      - targets: ["identity-service:8080"]

  - job_name: openfga
    metrics_path: /metrics
    static_configs:
      - targets: ["openfga:2112"]

  - job_name: user-db
    static_configs:
      - targets: ["user-db-exporter:9187"]

  - job_name: openfga-db
    static_configs:
      - targets: ["openfga-db-exporter:9187"]

  - job_name: identity-db
    static_configs:
      - targets: ["identity-db-exporter:9187"]
