openapi: 3.0.3

info:
  title: User Service API
  version: 1.0.0

servers:
  - url: /api/v1

paths:

  /users:
    post:
      operationId: createUser
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/OrganizationIdHeader"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"

      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"

    get:
      operationId: listUsers
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/OrganizationIdHeader"
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"

  /users/{id}:
    get:
      operationId: getUser
      tags:
        - Users

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/OrganizationIdHeader"

      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"
components:

  parameters:
    UserIdHeader:
      name: X-User-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    OrganizationIdHeader:
      name: X-Organization-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthenticated:
      description: Missing trusted identity headers
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PermissionDenied:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AuthorizationUnavailable:
      description: Authorization service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:

    CreateUserRequest:
      type: object
      required:
        - email
        - name

      properties:
        email:
          type: string
          format: email

        name:
          type: string
          minLength: 1

    User:
      type: object
      required:
        - id
        - email
        - name
        - createdAt

      properties:

        id:
          type: string
          format: uuid

        email:
          type: string
          format: email

        name:
          type: string

        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      required:
        - code
        - message

      properties:
        code:
          type: string

        message:
          type: string

        errors:
          type: object
          additionalProperties:
            type: string
